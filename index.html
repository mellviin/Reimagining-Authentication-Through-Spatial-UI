
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login Model</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.161.0/build/three.module.js",
        "jsm/": "https://cdn.jsdelivr.net/npm/three@0.161.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="password-popup">
    <div class="popup-content">
      <h3>ENTER YOUR PASSWORD:</h3>
      <div class="password-boxes">
        <input type="password" maxlength="1" oninput="moveToNext(this)" />
        <input type="password" maxlength="1" oninput="moveToNext(this)" />
        <input type="password" maxlength="1" oninput="moveToNext(this)" />
        <input type="password" maxlength="1" oninput="moveToNext(this)" />
        <input type="password" maxlength="1" oninput="moveToNext(this)" />
      </div>
      <div class="popup-buttons">
        <button class="submit-btn" onclick="checkPassword()">Submit</button>
        <button class="close-btn" onclick="closePopup()">Close</button>
      </div>
      <div id="password-result"></div>
    </div>
  </div>
  <audio id="wrong-sound" src="./sounds/wrong.mp3" preload="auto"></audio>
  <audio id="success-sound" src="./sounds/success.mp3" preload="auto"></audio>


  <script type="module" src="main.js"></script>
</body>

</html>
